<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FF14 高難副本機制練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#080b12; --bg2:#0d1120; --bg3:#131825; --border:#222d4a;
  --gold:#c8a84b; --gold-light:#e8cc7a; --gold-dim:#6a5218;
  --link-c:#4ecdc4; --link-dim:#1a4f4c;
  --unm-c:#e07050; --unm-dim:#5a2010;
  --green:#5cb85c; --green-dim:#1a3a1a;
  --red:#e05555; --red-dim:#3a1515;
  --text:#cec9be; --text-dim:#5a5650;
  --tank-c:#5b9cf6; --heal-c:#5cb85c; --dps-c:#e05555;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:'Noto Sans TC',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:18px 12px 48px;
  background-image:
    radial-gradient(ellipse 70% 40% at 50% -5%,rgba(78,205,196,.07) 0%,transparent 70%),
    radial-gradient(ellipse 50% 30% at 80% 110%,rgba(200,168,75,.05) 0%,transparent 70%);
}
header{text-align:center;margin-bottom:20px}
.logo-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:4px}
.crystal{width:22px;height:22px;background:linear-gradient(135deg,var(--link-c),var(--gold));
  clip-path:polygon(50% 0%,100% 35%,100% 65%,50% 100%,0% 65%,0% 35%);opacity:.85}
h1{font-family:'Cinzel',serif;font-size:clamp(15px,3.5vw,22px);font-weight:700;
  color:var(--gold-light);letter-spacing:2px;text-shadow:0 0 20px rgba(200,168,75,.4)}
.subtitle{font-size:11px;color:var(--text-dim);letter-spacing:1px;margin-top:4px}

.card{
  background:var(--bg2);border:1px solid var(--border);border-radius:6px;
  padding:18px;width:100%;max-width:700px;
  box-shadow:0 4px 32px rgba(0,0,0,.6);position:relative;margin-bottom:12px
}
.card::before{content:'';position:absolute;top:0;left:18px;right:18px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-dim),transparent)}
.sec-title{
  font-family:'Cinzel',serif;font-size:11px;color:var(--gold);
  letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;
  display:flex;align-items:center;gap:8px
}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── JOB ICON (shared) ── */
.job-icon{
  width:30px;height:30px;border-radius:3px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-size:10px;font-weight:700;letter-spacing:0
}
.job-icon.tank  {background:#0c1e50;color:#7ab0ff;border:1px solid #254aaa}
.job-icon.healer{background:#0c3a0c;color:#7ade7a;border:1px solid #257a25}
.job-icon.dps   {background:#3a0c0c;color:#ff8a7a;border:1px solid #8a2525}

/* ══════════════════════════════════════
   SELECT SCREEN – draggable party list
══════════════════════════════════════ */
.hint-text{font-size:11px;color:var(--text-dim);text-align:center;margin-bottom:10px}

.select-list{display:flex;flex-direction:column;gap:3px;margin-bottom:14px}

.srow{
  display:flex;align-items:center;gap:9px;
  padding:8px 12px;
  background:var(--bg3);border:1px solid var(--border);border-radius:4px;
  cursor:pointer;transition:background .12s,border-color .12s;
  user-select:none;position:relative
}
.srow:hover{background:#18202e;border-color:var(--gold-dim)}
.srow.selected{
  background:#172038;border-color:var(--gold);
  box-shadow:0 0 12px rgba(200,168,75,.15)
}
.srow.dragging{opacity:.3;border-style:dashed}
.srow.drag-over-top{border-top:2px solid var(--link-c);margin-top:-1px}
.srow.drag-over-bot{border-bottom:2px solid var(--link-c);margin-bottom:-1px}

.drag-handle{
  color:var(--text-dim);font-size:15px;cursor:grab;flex-shrink:0;
  padding:0 2px;line-height:1;letter-spacing:-2px;pointer-events:none
}

.s-prio{
  font-size:10px;color:var(--text-dim);
  min-width:22px;text-align:center;flex-shrink:0
}

.s-nameblk{display:flex;flex-direction:column;gap:1px;flex:1}
.s-role{
  font-family:'Cinzel',serif;font-size:14px;font-weight:700;line-height:1
}
.srow.tank   .s-role{color:var(--tank-c)}
.srow.healer .s-role{color:var(--heal-c)}
.srow.dps    .s-role{color:var(--dps-c)}
.srow.selected .s-role{color:var(--gold-light)!important}
.s-sub{font-size:9px;color:var(--text-dim)}

.s-you{
  font-size:9px;font-weight:700;letter-spacing:.5px;
  color:var(--gold-light);background:var(--gold-dim);
  border-radius:2px;padding:2px 6px;flex-shrink:0
}

.prio-note{font-size:11px;color:var(--text-dim);text-align:center;margin-top:10px;line-height:1.8}
.prio-note strong{color:var(--text)}

/* ══════════════════════════════════════
   QUIZ – FF14-style party list
══════════════════════════════════════ */
.quiz-list{
  display:flex;flex-direction:column;gap:2px;
  background:rgba(0,0,0,.55);
  border:1px solid #20283c;border-radius:4px;
  padding:5px 6px;margin-bottom:14px
}

.qrow{
  display:flex;align-items:center;gap:8px;
  padding:5px 6px;border-radius:2px;height:50px;
  border-left:2px solid transparent;
  background:rgba(255,255,255,.02);
  position:relative
}
.qrow.is-me{
  border-left-color:var(--gold);
  background:rgba(200,168,75,.045)
}

.qrow .job-icon{width:32px;height:32px;font-size:11px}

/* name + HP bar stacked */
.q-mid{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.q-name{
  font-family:'Cinzel',serif;font-size:13px;font-weight:700;
  line-height:1;display:flex;align-items:center;gap:6px
}
.qrow.tank   .q-name{color:var(--tank-c)}
.qrow.healer .q-name{color:var(--heal-c)}
.qrow.dps    .q-name{color:var(--dps-c)}
.qrow.is-me  .q-name{color:var(--gold-light)!important}

.q-you-chip{
  font-size:8px;font-weight:700;letter-spacing:.5px;
  background:var(--gold-dim);color:var(--gold-light);
  border-radius:2px;padding:1px 4px
}

/* bars row: HP then MP, equal width, 90% centered */
.bars-row{display:flex;align-items:center;gap:12px}

/* HP bar */
.hp-track{
  flex:1;height:8px;background:#090d16;
  border-radius:1px;overflow:hidden;
  border:1px solid #18202e
}
.hp-fill{
  height:100%;
  background:#f5ffff;
  border-radius:1px
}

/* MP bar */
.mp-track{
  flex:1;height:8px;background:#090d16;
  border-radius:1px;overflow:hidden;
  border:1px solid #18202e
}
.mp-fill{
  height:100%;
  background:#f5ffff;
  border-radius:1px
}

/* buff slot area (right side) */
.buff-area{
  display:flex;gap:2px;align-items:center;
  min-width:28px;justify-content:flex-end;flex-shrink:0
}
.link-buff{
  width:26px;height:26px;border-radius:2px;
  background:linear-gradient(145deg,#7a1212,#b81e1e);
  border:1px solid #d04040;
  display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-size:13px;font-weight:700;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 4px rgba(0,0,0,.5)
}

/* ══════════════════════════════════════
   ARENA
══════════════════════════════════════ */
.arena-wrap{
  position:relative;width:100%;padding-bottom:55%;
  background:linear-gradient(155deg,#0d1628 0%,#0a1020 100%);
  border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:12px
}
.arena-wrap::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(90deg,transparent 49.5%,rgba(255,255,255,.03) 49.5%,rgba(255,255,255,.03) 50.5%,transparent 50.5%),
    linear-gradient(0deg,transparent 49.5%,rgba(255,255,255,.03) 49.5%,rgba(255,255,255,.03) 50.5%,transparent 50.5%),
    radial-gradient(ellipse 80% 80% at 50% 50%,rgba(30,60,100,.14),transparent)
}
.arena-label{
  position:absolute;top:5px;left:0;right:0;text-align:center;
  font-family:'Cinzel',serif;font-size:9px;
  color:rgba(255,255,255,.1);letter-spacing:3px;pointer-events:none
}
.anode{
  position:absolute;transform:translate(-50%,-50%);
  width:13%;aspect-ratio:1;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;border:2px solid transparent;transition:all .18s;
  font-family:'Cinzel',serif;user-select:none;z-index:2
}
.anode-num{font-size:clamp(13px,3vw,20px);font-weight:700;line-height:1.1}
.anode-lbl{font-size:clamp(6px,1.2vw,9px);margin-top:1px;letter-spacing:.5px;opacity:.75}
.anode.node-hidden{
  background:radial-gradient(circle at 35% 35%,#1a2236,#0d1320);
  border-color:#2a3550;color:transparent
}
.anode.node-hidden:hover:not(.disabled){
  transform:translate(-50%,-50%) scale(1.1);z-index:10;
  border-color:#3a4f78;box-shadow:0 0 14px rgba(80,120,200,.2)
}
.anode.link-node{background:radial-gradient(circle at 35% 35%,#0e3230,#071c1b);border-color:var(--link-dim);color:var(--link-c)}
.anode.unm-node {background:radial-gradient(circle at 35% 35%,#2c1208,#160a04);border-color:var(--unm-dim);color:var(--unm-c)}
.anode.correct-node{
  border-color:var(--green)!important;background:radial-gradient(circle,#1e4a1e,#0f2010)!important;
  color:var(--green)!important;transform:translate(-50%,-50%) scale(1.18)!important;
  box-shadow:0 0 24px rgba(92,184,92,.5)!important;z-index:10
}
.anode.wrong-node{
  border-color:var(--red)!important;
  background:radial-gradient(circle,#3a1515,#1f0b0b)!important;color:var(--red)!important
}
.anode.reveal-node{border-color:var(--green)!important;z-index:11;animation:blink .45s ease-in-out 4}
@keyframes blink{0%,100%{box-shadow:0 0 16px rgba(92,184,92,.4)}50%{box-shadow:0 0 32px rgba(92,184,92,.85)}}
.anode.disabled{cursor:default}

/* ══════════════════════════════════════
   RESULT
══════════════════════════════════════ */
.result-panel{border-radius:4px;padding:13px;display:none;margin-bottom:8px}
.result-panel.ok{background:var(--green-dim);border:1px solid var(--green)}
.result-panel.ng{background:var(--red-dim);border:1px solid var(--red)}
.rh{font-family:'Cinzel',serif;font-size:14px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.result-panel.ok .rh{color:var(--green)}.result-panel.ng .rh{color:var(--red)}
.re{font-size:12px;color:var(--text);line-height:1.85}
.re strong{color:var(--gold-light)}
.re .hl{color:var(--link-c);font-weight:700}
.re .hu{color:var(--unm-c);font-weight:700}

/* ══════════════════════════════════════
   BUTTONS / MISC
══════════════════════════════════════ */
.btn{
  background:linear-gradient(135deg,#1a2840,#20325a);border:1px solid var(--gold-dim);
  color:var(--gold-light);border-radius:4px;padding:9px 22px;cursor:pointer;
  font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;transition:all .15s
}
.btn:hover{background:linear-gradient(135deg,#1f3050,#263d6e);border-color:var(--gold);box-shadow:0 0 14px rgba(200,168,75,.2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{
  background:transparent;border-color:var(--border);
  color:var(--text-dim);font-size:11px;padding:7px 14px
}
.btn-ghost:hover{background:#141a28;border-color:var(--border);box-shadow:none;color:var(--text)}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}

.stats-row{display:flex;gap:14px;flex-wrap:wrap;font-size:11px}
.si{color:var(--text-dim)}.si span{color:var(--gold-light);font-weight:700}

#qprompt{text-align:center;font-size:12px;color:var(--text-dim);margin-bottom:10px;line-height:1.6}

#sec-select,#sec-quiz{display:none}
#sec-select.active,#sec-quiz.active{display:block}
</style>
</head>
<body>

<header>
  <div class="logo-row">
    <div class="crystal"></div>
    <h1>High-End Duty Simulator</h1>
    <div class="crystal"></div>
  </div>
  <p class="subtitle">最終幻想XIV — 連線・無職 站位練習</p>
</header>

<!-- ══ SELECT ══ -->
<div class="card" id="sec-select">
  <div class="sec-title">選擇你的職位</div>
  <p class="hint-text">點擊列表選擇你的職位 ／ 拖曳調整優先順序</p>
  <div class="select-list" id="select-list"></div>
  <p class="prio-note">
    預設順序（高 → 低）：<strong>MT → ST → H1 → H2 → D1 → D2 → D3 → D4</strong><br>
    可拖曳調整，順序將影響無職編號的分配
  </p>
  <div class="btn-row">
    <button class="btn" id="btn-confirm" onclick="confirmPos()" disabled>確定職位，開始練習</button>
    <button class="btn btn-ghost" onclick="resetOrder()">重置排序</button>
  </div>
</div>

<!-- ══ QUIZ ══ -->
<div class="card" id="sec-quiz">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">
    <div class="sec-title" style="margin-bottom:0">本題場景</div>
    <div class="stats-row">
      <div class="si">✓ <span id="sc">0</span></div>
      <div class="si">✗ <span id="sw">0</span></div>
      <div class="si">準確率 <span id="sa">—</span></div>
    </div>
  </div>

  <!-- FF14-style party list -->
  <div class="quiz-list" id="quiz-list"></div>

  <p id="qprompt"></p>

  <!-- arena -->
  <div class="arena-wrap" id="arena-wrap">
    <div class="arena-label">A R E N A</div>
  </div>
  <div style="text-align:center;font-size:10px;color:var(--text-dim);margin-bottom:10px;letter-spacing:.5px">點擊地圖上你認為正確的站位</div>

  <!-- top action buttons (shown after answer) -->
  <div class="btn-row" id="btn-row-top" style="display:none;margin-bottom:10px">
    <button class="btn" onclick="nextRound()">下一題</button>
    <button class="btn btn-ghost" onclick="changePos()">換職位</button>
  </div>

  <!-- result -->
  <div class="result-panel" id="result-panel">
    <div class="rh" id="rh"></div>
    <div class="re" id="re"></div>
  </div>

  <!-- bottom action buttons -->
  <div class="btn-row">
    <button class="btn" id="btn-next" onclick="nextRound()" style="display:none">下一題</button>
    <button class="btn btn-ghost" onclick="changePos()">換職位</button>
  </div>
</div>

<script>
// ── Constants ─────────────────────────────────
const POSITIONS = ['MT','ST','H1','H2','D1','D2','D3','D4'];
const ROLE    = {MT:'tank',ST:'tank',H1:'healer',H2:'healer',D1:'dps',D2:'dps',D3:'dps',D4:'dps'};
const ROLE_LBL= {MT:'主坦',ST:'副坦',H1:'奶媽1',H2:'奶媽2',D1:'近戰1',D2:'近戰2',D3:'遠程3',D4:'遠程4'};
const JOB_LTR = {MT:'T',ST:'T',H1:'H',H2:'H',D1:'D',D2:'D',D3:'D',D4:'D'};

const ARENA_NODES = [
  {type:'unm',num:1,x:30,y:16},
  {type:'link',num:3,x:11,y:50},
  {type:'link',num:1,x:30,y:50},
  {type:'unm',num:2,x:30,y:84},
  {type:'unm',num:3,x:70,y:16},
  {type:'link',num:2,x:70,y:50},
  {type:'link',num:4,x:89,y:50},
  {type:'unm',num:4,x:70,y:84},
];

// ── State ─────────────────────────────────────
let priorityOrder = [...POSITIONS]; // user-adjustable
let myPos = null;
let linkPlayers = [], unmarkedPlayers = [];
let answered = false, sc = 0, sw = 0;

// drag state
let dragSrcPos = null, wasDragged = false;

function getPrio(pos){ return priorityOrder.indexOf(pos) + 1; }
function getUnmarked(linkSet){ return priorityOrder.filter(p => !linkSet.includes(p)); }

// ── INIT ──────────────────────────────────────
(function(){ buildSelectList(); document.getElementById('sec-select').classList.add('active'); })();

// ══════════════════════════════════════════════
//  SELECT SCREEN
// ══════════════════════════════════════════════
function buildSelectList(){
  const list = document.getElementById('select-list');
  list.innerHTML = '';
  priorityOrder.forEach((pos, i) => {
    const isSel = (pos === myPos);
    const row = document.createElement('div');
    row.className = `srow ${ROLE[pos]}${isSel ? ' selected' : ''}`;
    row.dataset.pos = pos;
    row.innerHTML = `
      <span class="drag-handle">⠿⠿</span>
      <span class="s-prio">#${i+1}</span>
      <div class="job-icon ${ROLE[pos]}">${JOB_LTR[pos]}</div>
      <div class="s-nameblk">
        <span class="s-role">${pos}</span>
        <span class="s-sub">${ROLE_LBL[pos]}</span>
      </div>
      ${isSel ? '<span class="s-you">YOU</span>' : ''}
    `;
    row.addEventListener('click', () => {
      if (wasDragged) return;
      selectPos(pos);
    });
    setupDrag(row, pos);
    list.appendChild(row);
  });
}

function resetOrder(){
  priorityOrder = [...POSITIONS];
  buildSelectList();
}

function selectPos(pos){
  myPos = pos;
  document.getElementById('btn-confirm').disabled = false;
  buildSelectList();
}

function confirmPos(){
  if (!myPos) return;
  document.getElementById('sec-select').classList.remove('active');
  document.getElementById('sec-quiz').classList.add('active');
  nextRound();
}

function changePos(){
  document.getElementById('sec-quiz').classList.remove('active');
  document.getElementById('sec-select').classList.add('active');
}

// ══════════════════════════════════════════════
//  DRAG & DROP (select screen)
// ══════════════════════════════════════════════
function setupDrag(row, pos){
  row.draggable = true;

  row.addEventListener('dragstart', e => {
    dragSrcPos = pos;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => row.classList.add('dragging'), 0);
    e.stopPropagation();
  });

  row.addEventListener('dragend', () => {
    row.classList.remove('dragging');
    document.querySelectorAll('.srow').forEach(r => r.classList.remove('drag-over-top','drag-over-bot'));
    wasDragged = true;
    setTimeout(() => wasDragged = false, 120);
  });

  row.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (pos === dragSrcPos) return;
    const mid = row.getBoundingClientRect().top + row.offsetHeight / 2;
    document.querySelectorAll('.srow').forEach(r => r.classList.remove('drag-over-top','drag-over-bot'));
    row.classList.add(e.clientY < mid ? 'drag-over-top' : 'drag-over-bot');
  });

  row.addEventListener('dragleave', () => {
    row.classList.remove('drag-over-top','drag-over-bot');
  });

  row.addEventListener('drop', e => {
    e.preventDefault();
    if (pos === dragSrcPos) return;
    const mid = row.getBoundingClientRect().top + row.offsetHeight / 2;
    const before = e.clientY < mid;
    const srcIdx = priorityOrder.indexOf(dragSrcPos);
    priorityOrder.splice(srcIdx, 1);
    const tgtIdx = priorityOrder.indexOf(pos);
    priorityOrder.splice(before ? tgtIdx : tgtIdx + 1, 0, dragSrcPos);
    buildSelectList();
  });
}

// ══════════════════════════════════════════════
//  ROUND
// ══════════════════════════════════════════════
function generateScenario(){
  const sh = [...POSITIONS].sort(() => Math.random() - .5);
  linkPlayers = sh.slice(0, 4);
  unmarkedPlayers = getUnmarked(linkPlayers);
}

function nextRound(){
  generateScenario();
  answered = false;
  document.getElementById('result-panel').style.display = 'none';
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('btn-row-top').style.display = 'none';
  buildQuizList();
  buildArena();
  updateStats();

  const li = linkPlayers.indexOf(myPos);
  const isLink = li !== -1;
  const prompt = document.getElementById('qprompt');
  if (isLink) {
    prompt.innerHTML = `你是 <strong style="color:var(--gold-light)">${myPos}</strong>，被指定為 <span style="color:var(--link-c);font-weight:700">連線${li+1}</span> — 點選地圖上你應該站的位置`;
  } else {
    prompt.innerHTML = `你是 <strong style="color:var(--gold-light)">${myPos}</strong>，屬於無職玩家 — 計算你的編號，點選地圖上正確的位置`;
  }
}

// ══════════════════════════════════════════════
//  QUIZ PARTY LIST  (FF14-style)
// ══════════════════════════════════════════════
function buildQuizList(){
  const list = document.getElementById('quiz-list');
  list.innerHTML = '';

  priorityOrder.forEach(pos => {
    const li = linkPlayers.indexOf(pos);
    const isLink = li !== -1;
    const isMe = (pos === myPos);
    const hp = Math.floor(Math.random() * 18) + 82; // 82–100 %
    // tanks rarely spend MP; healers spend more; DPS in between
    const mpBase = ROLE[pos]==='healer' ? 55 : ROLE[pos]==='tank' ? 82 : 68;
    const mp = Math.floor(Math.random() * 18) + mpBase;

    const row = document.createElement('div');
    row.className = `qrow ${ROLE[pos]}${isMe ? ' is-me' : ''}`;
    row.id = `qrow-${pos}`;

    row.innerHTML = `
      <div class="job-icon ${ROLE[pos]}">${JOB_LTR[pos]}</div>
      <div class="q-mid">
        <div class="q-name">
          ${pos}${isMe ? '<span class="q-you-chip">YOU</span>' : ''}
        </div>
        <div class="bars-row">
          <div class="hp-track"><div class="hp-fill" style="width:100%"></div></div>
          <div class="mp-track"><div class="mp-fill" style="width:100%"></div></div>
        </div>
      </div>
      <div class="buff-area" id="buff-${pos}">
        ${isLink ? `<div class="link-buff">${li+1}</div>` : ''}
      </div>
    `;
    list.appendChild(row);
  });
}

// ══════════════════════════════════════════════
//  ARENA
// ══════════════════════════════════════════════
function buildArena(){
  const wrap = document.getElementById('arena-wrap');
  wrap.querySelectorAll('.anode').forEach(n => n.remove());
  ARENA_NODES.forEach(nd => {
    const el = document.createElement('div');
    el.className = 'anode node-hidden';
    el.style.left = nd.x + '%';
    el.style.top  = nd.y + '%';
    el.dataset.type = nd.type;
    el.dataset.num  = nd.num;
    el.innerHTML = `<span class="anode-num">${nd.num}</span>
      <span class="anode-lbl">${nd.type==='link'?'連線':'無職'}</span>`;
    el.onclick = () => submitAnswer(nd.type, nd.num, el);
    wrap.appendChild(el);
  });
}

function revealArenaNodes(){
  document.querySelectorAll('.anode').forEach(el => {
    el.classList.remove('node-hidden');
    el.classList.add(el.dataset.type === 'link' ? 'link-node' : 'unm-node');
  });
}

// ══════════════════════════════════════════════
//  ANSWER
// ══════════════════════════════════════════════
function submitAnswer(type, num, el){
  if (answered) return;
  answered = true;
  document.querySelectorAll('.anode').forEach(n => { n.classList.add('disabled'); n.onclick = null; });

  const li = linkPlayers.indexOf(myPos);
  const isLink = li !== -1;
  const cType = isLink ? 'link' : 'unm';
  const cNum  = isLink ? (li + 1) : (unmarkedPlayers.indexOf(myPos) + 1);
  const ok = (type === cType && num === cNum);

  if (ok){ sc++; el.classList.add('correct-node'); }
  else {
    sw++; el.classList.add('wrong-node');
    document.querySelectorAll('.anode').forEach(n => {
      if (n.dataset.type === cType && +n.dataset.num === cNum) n.classList.add('reveal-node');
    });
  }

  revealArenaNodes();
  showResult(ok, type, num, cType, cNum);
  updateStats();
  document.getElementById('btn-next').style.display = 'inline-flex';
  document.getElementById('btn-row-top').style.display = 'flex';
}

function showResult(ok, chosenType, chosenNum, cType, cNum){
  const panel = document.getElementById('result-panel');
  panel.className = `result-panel ${ok ? 'ok' : 'ng'}`;
  panel.style.display = 'block';
  document.getElementById('rh').textContent = ok ? '✓ 正確站位！' : '✗ 站位錯誤';

  const li = linkPlayers.indexOf(myPos);
  const isLink = li !== -1;
  const myPrio = getPrio(myPos);
  let html = '';

  if (isLink){
    html += `你是 <strong>${myPos}</strong>，被分配為 <span class="hl">連線${li+1}</span>，對應地圖上的 <span class="hl">連線${li+1}</span> 位置。`;
  } else {
    const higherLinked = linkPlayers.filter(p => getPrio(p) < myPrio);
    html += `你是 <strong>${myPos}</strong>（優先序 #${myPrio}），屬無職玩家。<br>`;
    html += `比你優先的角色：<strong>${priorityOrder.filter(p => getPrio(p) < myPrio).join('、') || '無'}</strong><br>`;
    if (higherLinked.length) html += `其中 <span class="hl">${higherLinked.join('、')}</span> 為連線，排除後剩餘：<br>`;
    html += `無職依優先序：` +
      unmarkedPlayers.map((p,i) => {
        const s = p===myPos ? ' style="color:var(--gold-light);font-weight:700"' : ' style="color:var(--text-dim)"';
        return `<span${s}>${p}＝無職${i+1}</span>`;
      }).join(' → ');
    html += `<br>你是 <span class="hu">無職${cNum}</span>，應前往地圖 <span class="hu">無職${cNum}</span> 位置。`;
  }
  if (!ok) html += `<br><br>你點了「${chosenType==='link'?'連線':'無職'}${chosenNum}」，正確是「<strong>${cType==='link'?'連線':'無職'}${cNum}</strong>」。`;
  document.getElementById('re').innerHTML = html;
}

function updateStats(){
  document.getElementById('sc').textContent = sc;
  document.getElementById('sw').textContent = sw;
  const t = sc + sw;
  document.getElementById('sa').textContent = t ? Math.round(sc/t*100) + '%' : '—';
}
</script>
